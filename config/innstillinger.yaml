# Innstillinger for pensumboten.
# Endre her, ikke i koden, og kjør testsettet på nytt etter hver endring.

pensum_mappe: pensum
data_mappe: data

innlesing:
  fag: [ORG1100, MRK1001, BOA1100]     # alle fag som legges i indeksen
  standardfag: ORG1100                 # brukes når du ikke skriver --fag
  typer: [foiler, notater, oppgaver]   # eksamener tas inn i fase 2
  min_tegn_per_side: 20                # sider med mindre tekst enn dette hoppes over
  fjern_tekst:                         # støy som står på mange sider (bunntekst o.l.)
    - Kunnskap for en bedre verden

sprakmodell:
  leverandor: ollama           # ollama (lokal, gratis) eller anthropic (krever nøkkel i .env)
  temperatur: 0.1              # lav = saklig og forutsigbar (brukes av Ollama)
  ollama:
    modell: gemma4:e4b-it-qat  # 6,1 GB. gemma4:e4b (9,5 GB) ga swapping på 16 GB, se sjekk_maskin.py
    tenkning: false            # true = modellen resonnerer skjult før svaret (ca. 3x tregere)
    maks_tokens: 1500          # øvre grense per svar, hindrer at modellen går i løkke
    tidsgrense_sekunder: 90    # et kall som tar lengre tid, avbrytes (se kortsvar.py)
  anthropic:
    modell: claude-sonnet-5-5
    maks_tokens: 1024

embeddings:
  modell: intfloat/multilingual-e5-base   # maks 512 tokens per bit, krever "query: "/"passage: "

chunking:
  storrelse: 1000              # tegn, ikke ord (ca. 150 ord). SPEC sier 500–800 ord, men e5 kutter etter ~300 ord
  overlapp: 150                # tegn
  kontekst: true               # sett «fag · fil · tittel» foran hver PDF-side før embedding

henting:
  antall_biter: 6              # spesifikasjonen sier 5–8
  reranker: BAAI/bge-reranker-v2-m3   # sorterer kandidatene på nytt; tom = av
  halv_presisjon: true         # float16: halvparten så mye minne (1,1 GB), ca. 4x raskere
  kandidater: 30               # så mange hentes med vektorsøk før rerankeren velger

testing:
  mal_andel: 0.8               # 80 % riktig kilde (12 av 15). Testsett: tester/testsett_<fag>.yaml
