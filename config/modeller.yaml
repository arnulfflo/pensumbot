# Modellarket for MRK og ORG: hvilke seksjoner i modellnotatene som er modeller og teorier.
# Lest av src/modeller.py. Alt innhold kommer fra notatene dine. Denne fila sier bare hvilke
# seksjoner som er med, og retter navn og elementer der notatet ikke har en ren punktliste.
#
# Nøkkelen er starten på overskriften i notatet. Verdien kan være tom (ta med som den er), eller ha:
#   navn:      navnet på modellarket og i spørsmålene
#   elementer: «Navn – forklaring», når punktlisten i notatet mangler eller er rotete
#   med_neste: antall seksjoner rett etter som hører til modellen (teksten slås sammen)
# «ankere» er avsnitt som starter en modell selv om de ikke er en overskrift i notatet.
#
# Kjør etter endring:  uv run python -m src.modeller MRK1001

MRK1001:
  ankere:
    - "Kommunikasjonsprosessen (Shannon, 1948)"
    - "AIDA – effekthierarki"
    - "Kognisjon–affekt–erfaring"
    - "ELM – Elaboration Likelihood Model"
    - "FCB-matrisen"
    - "Integrert markedskommunikasjon – fem vurderingsfaktorer"
    - "Kreativitetsmodell (tilpasset fra Rosengren"
    - "Rossiters annonsemodell"
    - "Appell-typologi"
    - "Levende/interaktiv-modellen"
    - "TOFU/MOFU/BOFU"
    - "Inndeling etter følgertall"
    - "Fem anbefalinger for å lykkes med å sponse en sak"
    - "Attribueringshypotesen"
    - "SEO – tre kategorier"
    - "Adstock-modellen"
    - "Dette er EKB-modellen"
  modeller:
    # Kapittel 1
    "Behov, ønsker og begjær":
    "Fire former for nytteverdi":
    "Kohli & Jaworski (1990)":
      navn: "Markedsorientering (Kohli og Jaworski)"
      elementer:
        - "Innhenting av markedsinformasjon – om kunders nåværende og latente behov"
        - "Spredning av informasjonen – på tvers av organisasjonsnivåer"
        - "Reaksjon på informasjonen – informasjonen skal styre beslutninger"
    "Figur 1.4 – Kombinasjoner av markedsorientering":
      navn: "Markedsorientering og markedsføringskompetanse (2×2)"
    "Figur 1.5 – Interne drivkrefter":
      navn: "Interne drivkrefter for markedsorientering"
    "De fire grunnpilarene":
      navn: "Fire grunnpilarer i markedsorientert tankegang"
    "Triple bottom line":
      navn: "Triple bottom line (Elkington)"
      elementer:
        - "Økonomisk – tradisjonell avkastning og profitt"
        - "Miljømessig – miljøinnvirkningen av markedsstrategien"
        - "Sosial – den sosiale innvirkningen av markedsstrategien"
    "Etikk i markedsføring":
      navn: "Etikk i markedsføring (Hunt og Vittel)"
      elementer:
        - "Konsekvensetikk – handlingen vurderes ut fra konsekvensene"
        - "Pliktetikk – en autoritet har bestemt hva som er rett"
        - "Ytre rammer – kulturelt, profesjonelt og bransjemessig miljø"
        - "Personlige egenskaper – religion, verdisystem, trossystem"
    "Figur 1.11 – Markedsplanleggingsprosessen":
      navn: "Markedsplanleggingsprosessen"
      elementer:
        - "Styring – overordnede mål og bedriftsstrategi"
        - "Analyse – markedsmuligheter"
        - "Planlegging – markedsmål, markedsstrategi og markedsprogram"
        - "Gjennomføring og kontroll – markedsaktiviteter og kontroll"
    "Figur 1.13 – Marketing mix":
      navn: "Marketing mix (5 P)"
    # Kapittel 2
    "Figur 2.1 – Markedsføringssystemet":
      navn: "Markedsføringssystemet"
    "Delsystemene i markedsføringssystemet":
      navn: "Tre delsystemer: mikro, interessent og makro"
      elementer:
        - "Mikrosystemet – det bedriften er tettest på: leverandører, mellomledd, kunder og konkurrenter"
        - "Interessentsystemet – ansatte, offentlige instanser, media, finanskilder, aksjonsgrupper og publikum"
        - "Makrosystemet – demografiske, politiske, kulturelle, økonomiske, naturgitte og teknologiske faktorer"
    "Porters bransjeanalyse – utvidet (Figur 2.7)":
      navn: "Porters bransjeanalyse (fem krefter, utvidet)"
      med_neste: 5
      elementer:
        - "Konkurranseintensitet/rivalisering – sentrum i modellen"
        - "Trussel om nyetablering – stordriftsfordeler, merkeidentitet, kapitalkrav, byttekostnader"
        - "Leverandørenes forhandlingsstyrke – konsentrasjon, differensiering, byttekostnader"
        - "Kjøperens forhandlingsstyrke – konsentrasjon, volum, kunnskap, produktforskjeller"
        - "Trussel fra substitutter – substituttenes ytelse i forhold til pris, byttekostnader"
    "Ulike konkurranseformer (Tabell 2.2)":
      navn: "Konkurranseformer"
      elementer:
        - "Monopol – én aktør alene i markedet"
        - "Duopol – to dominerende aktører"
        - "Oligopol – få aktører som behersker markedet (rent eller differensiert)"
        - "Fullkommen konkurranse – svært mange, relativt like aktører"
        - "Monopolistisk konkurranse – mange aktører med differensierte produkter"
    "Oversikt over markedsførerens eksterne arbeidsbetingelser":
      navn: "Markedsførerens eksterne arbeidsbetingelser"
    "Ansoffs ekspansjonsmatrise":
      navn: "Ansoffs ekspansjonsmatrise"
    # Kapittel 3
    "Seks strateginivåer":
    "Visjon, forretningsidé og kjerneverdier":
    "Samfunnsansvar":
      navn: "Seks områder for samfunnsansvar (Sen og Bhattacharya)"
    "Balansert målstyring":
      navn: "Balansert målstyring (Balanced Scorecard)"
    "Strategiklokken":
      navn: "Strategiklokken (Faulkner og Bowman)"
      elementer:
        - "Rute 1: No frills – lav pris og lav tilført verdi"
        - "Rute 2: Lav pris – lav pris og middels verdi"
        - "Rute 3: Hybrid – høy opplevd verdi og lav pris"
        - "Rute 4: Differensiering – høy opplevd verdi og middels pris"
        - "Rute 5: Fokusert differensiering – høy opplevd verdi og høy pris"
        - "Rute 6–8: Feilstrategier – for høy pris i forhold til verdien"
    "Fem differensieringsområder":
    "SWOT-analyse":
      elementer:
        - "Styrker – interne forhold ved bedriften"
        - "Svakheter – interne forhold ved bedriften"
        - "Muligheter – eksterne forhold i omgivelsene"
        - "Trusler – eksterne forhold i omgivelsene"
    "Bedriftens kompetansematrise":
      navn: "Kompetansematrisen (Kotler)"
      elementer:
        - "Konsenter innsatsen her – svak, og stor betydning for kunden"
        - "Oppretthold den gode innsatsen – sterk, og stor betydning for kunden"
        - "Avvent situasjonen – svak, og liten betydning for kunden"
        - "Fare for overinvestering – sterk, og liten betydning for kunden"
    "Bedriftens trussel- og mulighetsmatrise":
      navn: "Trussel- og mulighetsmatrisen"
    "Strategisk problemdefinisjon (SPD)":
      navn: "Strategisk problemdefinisjon (SPD) og kritiske suksessfaktorer (KSF)"
      elementer:
        - "Kvadrant 1 i mulighetsmatrisen – mulighetene bedriften bør prioritere"
        - "Kvadrant 1 og 2 i kompetansematrisen – konsenter innsatsen og oppretthold"
        - "Kvadrant 1 i trusselmatrisen – truslene bedriften må ta mest på alvor"
    # Kapittel 4
    "Atferdsøkonomi: System 1 og System 2":
      navn: "System 1 og system 2 (Kahneman)"
    "Navngitte kognitive skjevheter":
      navn: "Kognitive skjevheter (Kahneman)"
    "Navngitte effekter (Dan Ariely)":
      navn: "Atferdseffekter (Ariely)"
    "Dette er EKB-modellen":
      navn: "EKB-modellen: forbrukerens kjøpsprosess"
      elementer:
        - "Problemerkjennelse – gap mellom ønsket og faktisk tilstand"
        - "Søkeprosess – intern og ekstern informasjon"
        - "Alternativ evaluering – alternativene vurderes etter kriterier"
        - "Valg – beslutningen, påvirket av situasjonsfaktorer"
        - "Resultat – innfridde produktet forventningene?"
    "4.3.3 Informasjonssøking":
      navn: "Informasjonskilder ved kjøp"
    "Fishbeins forenklede holdningsmodell":
      navn: "Fishbeins holdningsmodell"
      elementer:
        - "Tro om objektet – det du mener om enkeltegenskaper"
        - "Holdning – den samlede positive eller negative følelsen"
        - "Intensjoner – hva du har lyst til å gjøre"
        - "Atferd – det du faktisk gjør"
    "Multiattributtmodeller":
      med_neste: 1
      elementer:
        - "Kompensatoriske modeller – svakhet på ett attributt kan veies opp av styrke på et annet (Ab = Σ Wi × Bib)"
        - "Ikke-kompensatoriske modeller – forbrukeren setter minstekrav til egenskapene"
    "4.3.6 Resultater":
      navn: "Resultater etter kjøpet"
    "Forhold som virker inn på kjøpsatferden":
      navn: "Forhold som påvirker kjøpsatferden (Kotler og Keller)"
      elementer:
        - "Kulturelle forhold – kultur og subkultur"
        - "Sosiale forhold – referansegrupper, familie, roller og status"
        - "Demografiske forhold – alder og livsstil, økonomi, livssyklus"
        - "Personlige forhold – motivasjon, oppfatning, læring, holdninger og verdier"
    "Adopsjonsprosessen – fem trinn":
      navn: "Adopsjonsprosessen"
    "Diffusjon av innovasjoner":
      navn: "Diffusjon av innovasjoner (Rogers)"
    "Forbrukeratferd på nett":
    # Kapittel 5
    "Klassifisering av produkter på bedriftsmarkedet":
      navn: "Produkter på bedriftsmarkedet"
    "Ulike typer kjøp":
      navn: "Tre typer kjøp på bedriftsmarkedet"
    "Tre kjøpstilnærminger":
    "Beslutningsprosessen (Figur 5.2)":
      navn: "Organisasjoners beslutningsprosess (Webster og Wind)"
      elementer:
        - "Problem/behov"
        - "Kriterier/kvanta"
        - "Spesifikasjoner"
        - "Søking blant leverandører"
        - "Vurdering av leverandører"
        - "Valg av leverandør"
        - "Ordreplassering"
        - "Oppfølging"
    "Kjøpssenteret":
      navn: "Kjøpssenteret (Bonoma)"
    "Viktige kjøpskriterier på bedriftsmarkedet":
      navn: "Kjøpskriterier på bedriftsmarkedet (Selnes)"
    "Ti typer bånd":
      navn: "Ti typer bånd mellom aktører (Liljander og Strandvik)"
    "Relasjonsprosessen":
    "Forhandlingsmakt i kunde–leverandørforhold":
      navn: "Forhandlingsmakt i kunde–leverandørforhold (Hollensen)"
    # Kapittel 6
    "STP-rammeverket":
    "Segmenteringsvariabler":
    "Segmenteringskriterier":
    "RFM-modellen":
      elementer:
        - "Recency – hvor nylig kunden kjøpte"
        - "Frequency – hvor ofte kunden kjøper"
        - "Monetary value – hvor mye kunden kjøper for"
    "CLV – Customer Lifetime Value":
      navn: "CLV – kundens livstidsverdi"
      elementer:
        - "Kostnaden for å skaffe kunden – markedsføringstiltak"
        - "Kontantstrømmen kunden gir over tid – dekningsbidraget"
        - "Hvor lenge kunden forblir aktiv"
    "Personas (6.7)":
      navn: "Personas"
      med_neste: 1
      elementer:
        - "Datainnsamling – atferd og kjennetegn"
        - "Sammenstille motivasjoner og behov"
        - "Bestemme personas"
        - "Inngående beskrivelse av personas"
    "Segmentering på bedriftsmarkedet":
      navn: "Segmenteringskriterier på bedriftsmarkedet (Biong, Nes og Sande)"
    "Strategiske vurderinger ved målretting":
      navn: "Målrettingsstrategier"
    # Kapittel 7
    "7.1 Hva er egentlig et":
      navn: "Tre produktnivåer"
      elementer:
        - "Kjerneprodukt – det egentlige behovet kunden dekker"
        - "Konkret produkt – kvalitet, egenskaper, design, merkenavn, innpakning"
        - "Utvidet produkt – installasjon, levering, betaling, garanti, service"
    "7.3.1 Grunnbegrepene":
      navn: "Sortimentets tre dimensjoner"
      elementer:
        - "Bredde – hvor mange produktgrupper"
        - "Dybde – hvor mange varianter i hver gruppe"
        - "Sammenheng (konsistens) – hvor mye produktgruppene henger sammen"
    "7.3.4 Kategoristyring":
      navn: "Kategoristyring (åtte trinn)"
    "7.3.5 BCG-matrisen":
      navn: "BCG-matrisen"
      med_neste: 2
      elementer:
        - "Stjerne – høy markedsvekst, høy relativ markedsandel"
        - "Melkeku – lav markedsvekst, høy relativ markedsandel"
        - "Problembarn – høy markedsvekst, lav relativ markedsandel"
        - "Hund – lav markedsvekst, lav relativ markedsandel"
    "Hva gjør man med denne informasjonen? (4 strategier)":
      navn: "Fire strategier i BCG-matrisen"
    "To måter å forstå kvalitet på":
      navn: "To syn på kvalitet"
    "7.5 Produktutvikling — den enkle":
      navn: "Produktutviklingsmodellen"
    "5. Testsalg":
      navn: "Testsalg: kjøp og gjenkjøp"
    "7.6 Livssyklus":
      navn: "Produktets livssyklus (PLC)"
      med_neste: 5
    "Sidenotat: Figur 7.16":
      navn: "Classics, trends og fads"
    # Kapittel 8
    "De fire grunnleggende distribusjonsveiene":
      navn: "Distribusjonsveier"
      elementer:
        - "Produsent → forbruker – direkte distribusjon"
        - "Produsent → detaljist → forbruker"
        - "Produsent → grossist → detaljist → forbruker"
        - "Tredjepartsaktører – kan kobles inn hvor som helst i kjeden"
    "Tre strategiske valg en produsent har for internett":
      navn: "Tre strategiske valg for netthandel"
    "8.5.2 Distribusjonsstrategiens":
      navn: "Distribusjonsstrategiens 6 C-er"
      elementer:
        - "Character – markedets karakter: volum, kundetyper, geografi"
        - "Coverage – hvor stor del av markedet kanalen når"
        - "Compatibility – om kanalen passer profilen til produktet"
        - "Cost – avanse, provisjon og krav til støtte"
        - "Continuity – om kanalvalget er stabilt over tid"
        - "Control – hvor mye leverandøren kan styre pris og profilering"
    "8.5.3 Omfanget av distribusjonen":
      navn: "Intensiv, selektiv og eksklusiv distribusjon"
      med_neste: 1
    "Fire nivåer av samarbeid":
      navn: "Fire nivåer av samarbeid i distribusjonskanalen"
    # Kapittel 9
    "9.1 Mål for prispolitikken":
      navn: "Mål for prispolitikken"
      med_neste: 7
      elementer:
        - "Maksimere salget"
        - "Markedsandel"
        - "Maksimere fortjenesten"
        - "En gitt fortjenestemargin"
        - "Møte eller unngå konkurranse"
        - "Stabilisere prisnivået"
        - "Støtte andre produkter"
    "Elastisitetens tallverdi":
      navn: "Priselastisitet"
      med_neste: 1
    "9.4.1 Grunnleggende beslutninger":
      navn: "Prisnivå i forhold til markedsprisen"
    "Produktets alder — skimming":
      navn: "Skimming og penetrasjonspris"
      elementer:
        - "Skimming – relativt høy introduksjonspris for nyvinninger med uelastisk etterspørsel"
        - "Penetrasjonspris – relativt lav pris for å bli akseptert raskt av et stort marked"
    "9.5.3 Konkurranseorienterte priser":
    "9.6 Rabattpolitikk":
    # Kapittel 10
    "Kommunikasjonsprosessen (Shannon, 1948)":
      navn: "Kommunikasjonsprosessen (Shannon)"
      elementer: ["Avsender", "Koding", "Kanal", "Dekoding", "Mottaker", "Støy – påvirker hele prosessen"]
    "AIDA – effekthierarki":
      navn: "AIDA"
      elementer: ["Attention – oppmerksomhet", "Interest – interesse", "Desire – ønske", "Action – handling"]
    "Kognisjon–affekt–erfaring":
      navn: "Kognisjon, affekt og erfaring (Vakratsas og Ambler)"
      elementer:
        - "Kognisjon – tenkning og vurdering av fakta"
        - "Affekt – følelser vekket av produkt eller merke"
        - "Erfaring – preferanse bygget gjennom repetisjon og vaner"
    "ELM – Elaboration Likelihood Model":
      navn: "ELM – Elaboration Likelihood Model"
      elementer:
        - "Sentral rute – høy involvering: logikk, fakta og informasjon gir sterk holdningsendring"
        - "Perifer rute – lav involvering: andre virkemidler og heuristikker gir svak holdningsendring"
    "FCB-matrisen":
      navn: "FCB-matrisen (Vaughn)"
    "Integrert markedskommunikasjon – fem":
      navn: "Integrert markedskommunikasjon"
      elementer:
        - "Dekning og rekkevidde"
        - "Kostnader"
        - "Like eller ulike assosiasjoner på tvers av kanaler"
        - "Synergier og timing"
        - "Konformitet"
    "Kreativitetsmodell":
      navn: "Kreativitetsmodellen for annonser (Rosengren)"
      elementer:
        - "Kreativitet – divergens og relevans"
        - "Kortsiktige effekter – affekt, prosessering og signalisering"
        - "Resultater – holdning og kjennskap til annonse og merke"
    "Rossiters annonsemodell":
      elementer: ["Markør – fanger oppmerksomhet", "Nysgjerrighet", "Produkt/merke", "Søk etter svar", "Påstått fordel"]
    "Appell-typologi":
      navn: "Appeller i annonser"
      elementer:
        - "Kjendiser – kredibilitet er attraktivitet, ekspertise og tillit"
        - "Frykt"
        - "Demonstrasjon"
        - "Eksperter"
        - "Humor – risiko for vampyreffekten"
        - "Informative appeller – hard-sell eller soft-sell"
        - "Innramming – positiv eller negativ motivasjon"
    "Levende/interaktiv-modellen":
      navn: "Levende og interaktivt innhold (Steuer)"
      elementer: ["Levende (vivid)", "Interaktivt"]
    "TOFU/MOFU/BOFU":
      elementer:
        - "TOFU – toppen av trakten: informerende"
        - "MOFU – midten: bygger relasjon og tillit"
        - "BOFU – bunnen: konverterer til salg"
    "Inndeling etter følgertall":
      navn: "Influensere etter følgertall"
      elementer: ["Nano", "Mikro", "Medium", "Makro", "Mega"]
    "Fem anbefalinger for å lykkes med å sponse":
      navn: "Fem råd for å sponse en sak (Schamp)"
      elementer:
        - "Sikre forståelse for hva som doneres"
        - "Velg passende kontekst"
        - "Vær oppriktig opptatt av saken"
        - "Fokuser på emosjonell tilknytning"
        - "Avklar de viktigste markedsføringsmålene"
    "Attribueringshypotesen":
      navn: "Attribueringshypotesen (salgsfremmende tiltak)"
    "SEO – tre kategorier":
      navn: "SEO"
      elementer:
        - "On-page SEO – sideoptimalisering"
        - "Technical SEO – tekniske tiltak"
        - "Off-page SEO – referanser og lenker"
    "Adstock-modellen":
      elementer:
        - "Effekten har begrenset varighet"
        - "Effekten avtar jo nærmere et mettet marked man er"
    # Kapittel 11
    "11.1.1 Hva er posisjonering":
      navn: "Fire modeller for merkevaren"
    "11.1.3 Psykologiske produktfordeler":
      navn: "Psykologiske produktfordeler"
      elementer:
        - "Opplevelsesbaserte fordeler – kognitiv eller sensorisk positiv stimulans"
        - "Symbolske fordeler – signalverdi gjennom status, luksus, identitet eller gruppetilhørighet"
    "11.2 Merkevarestrategi":
      navn: "Fire vurderinger ved posisjonering av en merkevare (Stengel)"
    "11.2.1 Merkevarekapital":
      navn: "Tre måter å måle merkevarekapital"
      elementer:
        - "Kostnadstilnærmingen – totale kostnader brukt på å bygge merket"
        - "Markedstilnærmingen – salgsøkning sammenlignet med generiske produkter"
        - "Finanstilnærmingen – nåverdien av fremtidig kontantstrøm knyttet til merket"
    "Seks argumenter for at kjeder etablerer EMV":
      navn: "Handelens egne merkevarer (EMV)"
    "11.2.3 Persepsjons- og assosiasjonskart":
      navn: "Persepsjonskart"
      elementer:
        - "Identifiser relevante produkter og egenskaper"
        - "Innhent persepsjonsdata – spørreskjema i et definert segment"
        - "Velg egnet analysemetode"
        - "Plott i et persepsjonskart"
    "11.2.4 Co-branding":
      navn: "Co-branding og merkevareutvidelser"
      elementer:
        - "Merkevareutvidelse – et etablert merke brukes på et nytt produkt"
        - "Utvanning – merket svekkes når navnet spres på for mange produkter"
        - "Felles-co-branding – begge merkene på et helt nytt produkt"
        - "Ingrediens-co-branding – ett merke inngår som ingrediens i et annet"
    "11.2.6 Merkeverdikjeden":
      navn: "Merkeverdikjeden"
    # Kapittel 12
    "Hva skiller transaksjons- og relasjonsorientering":
      navn: "Transaksjons- og relasjonsorientering"
      elementer:
        - "Transaksjonsorientering – enkeltsalg, kort tidshorisont, vekt på produktfordeler"
        - "Relasjonsorientering – kundevarighet, lang tidshorisont, vekt på kundeverdi og service"
    "Hva er offensiv og defensiv strategi":
      navn: "Offensiv og defensiv strategi og byttebarrierer"
      elementer:
        - "Offensiv strategi – rettet mot nye kunder"
        - "Defensiv strategi – rettet mot eksisterende kunder"
        - "Negative barrierer – fysisk byttekostnad som låser kunden fast"
        - "Positive barrierer – psykisk byttekostnad og opplevd nytte"
    "Hva er lojalitet, og hva er de fire nivåene":
      navn: "Fire nivåer av lojalitet (Oliver)"
    "Hva er kundetilfredshet":
      navn: "Kundetilfredshet og forventningsbrøken"
      elementer: ["Leveranse", "Forventning", "Tilfredshet – leveranse delt på forventning"]
    "Hvordan henger tilfredshet og lojalitet sammen":
      navn: "Norsk Kundebarometer (NKB)"
      elementer:
