# Eksamensdatoer og temaer per fag. Brukes av planleggeren (fase 3).
# Fyll inn fra emnebeskrivelse eller pensumliste – ikke gjett.
#
# Fylt inn 30.10.2026 fra notater/<fag>_emneoversikt.docx:
# - datoer fra «2. Eksamen»
# - temaer fra fremdriftsplanen/undervisningsplanen (ett tema per kapittel)
# Rediger fritt: legg til, fjern eller slå sammen temaer. Temanavnet brukes også som
# søk når planleggeren starter en quiz, så skriv det slik at det beskriver innholdet.

timer_per_dag: 6           # alle fag til sammen (svar fra deg 30.10.2026)
blokk_minutter: 45         # én øvingsøkt; dagen deles i blokker av denne lengden
repetisjonsdager: 2        # de siste dagene før en eksamen brukes bare på det faget

