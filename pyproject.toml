[project]
name = "pensumbot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "chromadb>=1.5.9",
    "gradio>=6.31.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "ocrmac>=1.0.1",
    "ollama>=0.6.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]       # så testene finner src/
testpaths = ["tester"]
